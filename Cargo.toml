[package]
name = "zirv"
version = "2.21.0"
edition = "2024"
authors = ["Jonathan Solskov <josj@zirv.io>"]
description = "A CLI tool for executing developer-defined YAML scripts with support for interactive commands and OS-specific execution."
repository = "https://github.com/Glubiz/zirv"
license = "MIT"
readme = "README.md"
keywords = ["cli", "yaml", "automation", "developer"]
categories = ["development-tools"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1.0.149"
toml = "1.0.6"
dirs = "6.0.0"
console = "0.16.3"
dialoguer = "0.12.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time", "process"] }
hashbrown = { version = "0.16.1", features = ["serde"] }
futures = "0.3.32"
slab = "0.4.12"
regex = "1"
portable-pty = "0.9.0"
uuid = { version = "1.24.0", features = ["v4"] }
crossterm = "0.29"
ratatui = "0.30"
vt100 = "0.16"
ureq = "3"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

# Already in the tree transitively (console, dirs-sys, mio, tempfile all pull
# it); named here so `ctx wrap` can call the console-mode and named-pipe APIs
# directly instead of adding a second, redundant win32 binding crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    # Kill-on-close job objects: the kernel-enforced backstop that reaps a
    # supervised agent's whole tree when zirv dies without running any code
    # of its own (`taskkill /F`, a crash, `panic = "abort"`). See
    # `ctx::supervise::JobGuard`.
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
opt-level       = "z"
lto             = true
codegen-units   = 1
debug           = false
debug-assertions = false
panic           = "abort"
strip           = "symbols"
