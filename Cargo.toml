[package]
name = "zirv"
version = "2.5.0"
edition = "2024"
authors = ["Jonathan Solskov <josj@zirv.io>"]
description = "A CLI tool for executing developer-defined YAML scripts with support for interactive commands and OS-specific execution."
repository = "https://github.com/Glubiz/zirv"
license = "MIT"
readme = "README.md"
keywords = ["cli", "yaml", "automation", "developer"]
categories = ["development-tools"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml_ng = "0.10.0"
serde_json = "1.0.149"
toml = "1.0.6"
dirs = "6.0.0"
console = "0.16.3"
dialoguer = "0.12.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "time", "process"] }
hashbrown = { version = "0.16.1", features = ["serde"] }
futures = "0.3.32"
slab = "0.4.12"
regex = "1"
portable-pty = "0.9.0"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[profile.release]
opt-level       = "z"
lto             = true
codegen-units   = 1
debug           = false
debug-assertions = false
panic           = "abort"
strip           = "symbols"