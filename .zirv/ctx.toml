# [workflow.maintain]                # REPO-FORBIDDEN as a whole: detector commands execute with operator authority and must live only in ~/.zirv/ctx.toml.
# timeout_secs = 60                  # timeout applied to each deterministic detector. Default: 60, hard-capped by the maintain runner.
#
# [workflow.maintain.detectors.example]
# command = "cargo audit --quiet"     # operator-authored shell command; repository layers may never set it.
# mode = "exit-nonzero"              # "exit-nonzero" or "line-count".
# threshold = 1                      # line-count breaches at >= threshold; exit-nonzero ignores this value.

# [report]
# repository = "owner/repository"    # REPO-FORBIDDEN (ZIRV_CTX_REPORT_REPOSITORY): destination for workflow-maintain incidents only. The ordinary report command keeps its fixed Zirv repository default.

# [policy]                           # zirv's own canonical permissions policy (src/commands/ctx/policy.rs).
# Not REPO-FORBIDDEN, and the ONE table here that does NOT deep-merge:
# `[policy]` is lifted out of every layer and folded by `policy::resolve` as
# `env(cap)` if set, else `max(home(cap), repo(cap))`, over the ordered stance
# `allow < ask < deny`. So a repo checkout may only ever ratchet a stance
# STRICTER, never looser -- which is why forbidding these keys outright would
# also forbid the narrowing they exist for. `ZIRV_CTX_POLICY_<CAPABILITY>`
# sits above the fold and wins in both directions (the operator's escape
# hatch, mirroring ZIRV_AGENT_<NAME>_ENABLED). Every stance defaults to
# "allow", meaning "zirv declares no restriction of its own"; what each
# harness can actually enforce for a stricter one is reported per adapter,
# honestly, rather than assumed -- see AgentAdapter::policy_support.
# repo_fs_write = "allow"            # writes inside this checkout. Default: "allow".
# outside_repo_fs_write = "allow"    # writes anywhere else on the machine. Default: "allow".
# shell_exec = "allow"               # running shell commands at all. Default: "allow".
# network = "allow"                  # outbound network access from the session. Default: "allow".
# approval = "allow"                 # "allow" = approvals may be bypassed, "ask" = must be requested, "deny" = attempt nothing needing approval (a read-only session). Default: "allow".
# git_push_destructive = "allow"     # `git push`, and history-rewriting/destructive git. Default: "allow".
# tool_access = "allow"              # which of the harness's own tools (including MCP servers) may run. Default: "allow".

# [safety]                           # zirv's harness-neutral command safety policy (src/commands/ctx/safety.rs, issue #83).
# `deny`/`ask` are NOT REPO-FORBIDDEN and do NOT deep-merge: a repo checkout
# may ADD entries to either (narrowing is always safe -- deny and ask are
# both checked before allow), unioned with the operator's own home-layer
# entries and the built-in set derived from adapters::SHIPPED_POSTURE_ALLOW/
# _DENY (always present regardless of configuration). `allow`, `escape_allow`
# and `default` ARE REPO-FORBIDDEN (ZIRV_CTX_SAFETY_ALLOW /
# ZIRV_CTX_SAFETY_ESCAPE_ALLOW / ZIRV_CTX_SAFETY_DEFAULT): adding an allow or
# escape_allow entry or changing the unmatched-command default can only ever
# widen the effective policy, never narrow it.
# deny = ["terraform destroy*"]      # additional deny patterns, unioned with the built-in set. Default: [] (built-in set only).
# ask = ["kubectl delete*"]          # additional ask patterns, unioned with the built-in set. Default: [] (built-in set only).
# allow = ["just test*"]             # REPO-FORBIDDEN (ZIRV_CTX_SAFETY_ALLOW): additional allow patterns, operator-only. Default: [] (built-in set only).
# escape_allow = ["just test*"]      # REPO-FORBIDDEN (ZIRV_CTX_SAFETY_ESCAPE_ALLOW): patterns pre-cleared for a --dangerously-disable-sandbox retry specifically, operator-only. Every executable segment of the retry must match. Default: [] (built-in read-only-utility seed only -- see docs).
# default = "ask"                    # REPO-FORBIDDEN (ZIRV_CTX_SAFETY_DEFAULT): verdict for a command matching no rule. Default: "ask".
# interactive_default = "allow"      # REPO-FORBIDDEN (ZIRV_CTX_SAFETY_INTERACTIVE_DEFAULT): verdict for a command matching no rule on an INTERACTIVE launch. Default: "allow" -- a command zirv has never seen must not prompt. `default` above still governs headless launches.
# sql = "on"                         # REPO-FORBIDDEN (ZIRV_CTX_SAFETY_SQL): "on" classifies psql/mysql/mariadb/sqlite3/duckdb/sqlcmd statements (a single provably read-only SELECT/EXPLAIN/SHOW is allowed, everything else asks); "off" disables it. Default: "on".
# Issue #313's two loop breakers: NOT REPO-FORBIDDEN, unlike every other key
# in this table above -- a repo may LOWER (narrow) any of the three, but
# never raise one above the operator's own home-layer ceiling, and never
# turn a `0` (disabled) breaker back on. See `narrow_threshold` in safety.rs.
# denial_breaker_threshold = 3        # trailing consecutive Ask/Deny verdicts in one session, this decision included, before the hook's reason text stops explaining the policy and tells the agent to stop retrying. 0 disables. Default: 3.
# identical_command_warn_after = 2    # trailing consecutive failures of the exact same Bash command (from the session transcript) before an Allow verdict also carries a warning in additionalContext. 0 disables. Default: 2.
# identical_command_refuse_after = 5  # the same identical-failing-command count at which a HEADLESS launch (only) turns the verdict into Deny instead of merely warning; interactive launches never auto-refuse. 0 disables. Default: 5.
