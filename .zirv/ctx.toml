# Repo-layer zirv configuration (untrusted layer: operator config and env win).
#
# This file is an exhaustive reference of every configurable key of
# `CtxConfig` (see src/commands/ctx/config.rs), each shown COMMENTED OUT at
# its built-in default -- sample-config style. Uncomment a key to override it
# for this repo.
#
# A commented key sets nothing, so an operator's own ~/.zirv/ctx.toml
# customization of that same key keeps working. This matters because the
# repo layer merges ON TOP of the operator's global config (see
# `CtxConfig::load`): an ACTIVE default-valued key here would silently
# clobber any global override of the same key for anyone who checks out this
# repo. Only uncomment a key you actually mean to pin for this repo.
#
# Keys marked REPO-FORBIDDEN may not be set from a repo checkout at all (see
# REPO_FORBIDDEN in config.rs) -- uncommenting one has no effect here; set it
# in ~/.zirv/ctx.toml, via ZIRV_CTX_* env vars, or flags instead. The value
# shown is still the real default, for reference.

# agent = "claude"             # REPO-FORBIDDEN (ZIRV_CTX_AGENT): which adapter zirv drives. Default: unset (auto-detect).
# agent_bin = "/path/to/bin"   # REPO-FORBIDDEN (ZIRV_CTX_AGENT_BIN): explicit path to the agent binary. Default: unset.

[chat]
# Model for the interactive orchestrator session (displayed in the banner/header).
# User decision 2026-08-13: the orchestrator runs Fable (claude-fable-5).
# Not REPO-FORBIDDEN: this only shapes a session the operator deliberately
# launched, and the choice is disclosed on the `zirv \u{25b8}` announcement
# channel rather than spent silently in the background (see ChatConfig's doc
# comment in config.rs). Commenting this out reverts to the built-in default
# (unset: leaves the agent's own default model in place). This is the ONLY
# active key in this file -- every other key below is commented out.
model = "fable"

# [review]                          # every key below is REPO-FORBIDDEN (ZIRV_CTX_REVIEW_MODEL_CLAUDE / ZIRV_CTX_REVIEW_MODEL_CODEX)
# claude = "opus"                   # code-review model for a claude harness. Default: unset (one tier below the orchestrator seat's model on claude's ladder -- see AgentAdapter::review_model_below).
# codex = "gpt-5.6-terra"           # code-review model for a codex harness. Default: unset (one tier below the seat on codex's own ladder).

# [worker]                          # every key below is REPO-FORBIDDEN (ZIRV_CTX_WORKER_MODEL_CLAUDE / ZIRV_CTX_WORKER_MODEL_CODEX)
# claude = "opus"                   # model for a delegated headless claude worker (`zirv ctx agent`, and the dashboard's own spawn-request pane). Default: unset (claude's own hard default "sonnet" -- see AgentAdapter::default_worker_model).
# codex = "gpt-5.6-terra"           # model for a delegated headless codex worker. Default: unset (codex has no adapter-owned default, so its own CLI/config default applies).

# [score]
# window = 10                        # trailing turns the rolling rot score looks over
# min_turns = 10                     # turns required before the score is trusted at all
# token_floor = 100_000              # tokens below which token pressure contributes nothing
# token_ceiling = 160_000            # tokens at which token pressure is maxed out
# weight_tool_failure = 40.0         # score weight for repeated tool failures (weights sum to 100)
# weight_repetition = 30.0           # score weight for repeated actions
# weight_marker = 30.0               # score weight for the rot marker appearing in output
# repetition_threshold = 3           # repeat count before the repetition signal trips
# advise_at = 40                     # score at which zirv advises the operator
# compact_at = 60                    # score at which zirv recommends a compact/handoff
# restart_at = 80                    # score at which zirv recommends a restart
# marker = "[zirv]"                  # literal string the rot engine treats as an explicit marker signal

# [wrap]
# debounce_ms = 3000                 # quiet time after output before wrap considers a turn settled
# inject_timeout_ms = 20_000         # how long wrap waits for an injected prompt to land

# [supervise]
# max_restarts = 2                   # restarts a supervised run allows before giving up
# poll_ms = 2000                     # polling interval for supervised process state
# interval_secs = 900                # interval between supervised health checks
# max_cycle_secs = 3600              # max wall time for one supervised cycle
# max_failures = 5                   # consecutive failures before supervise gives up entirely
# backoff_base_secs = 60             # base backoff between restart attempts
# on_failure = "notify-send done"    # REPO-FORBIDDEN (ZIRV_CTX_ON_FAILURE): shell command run on failure. Default: unset.
# max_nudges = 3                     # consecutive nudge-driven restarts tolerated before nudges are ignored

# [handoff]
# model = "haiku"                    # REPO-FORBIDDEN (ZIRV_CTX_MODEL): distiller/judgment model override. Default: unset (adapter decides).
# tail_items = 5                     # trailing user/assistant/tool-error items kept in structural context
# timeout_secs = 30                  # time the distiller gets before falling back to structural context

# [pace]
# enabled = true                     # whether pace-to-reset throttling runs at all
# max_percent = 99.0                 # a supervised window is kept at or below this usage percentage
# collector_max_age_secs = 900       # collector readings older than this are treated as stale
# estimator = true                   # whether the token estimator fallback runs when the collector is stale
# five_hour_budget_tokens = 0        # 0 disables the estimator for the 5h window (no honest default)
# seven_day_budget_tokens = 0        # 0 disables the estimator for the 7d window (no honest default)
# count_cache_reads = false          # whether cache-read tokens count toward the estimator budget
# jitter_secs = 30                   # random jitter added to delays to avoid thundering-herd resumes
# fallback_delay_secs = 900          # delay used when a window's resets_at is unknown
# wait_slack_secs = 3600             # head-room added to the window length to form the default safety cap
# max_wait_secs = 7200               # absolute override for the safety cap. Default: unset (scales to the tripped window).
# soft_percent = 80.0                # start of the soft-throttle band (delays scale linearly up to max_percent)
# poll_enabled = true                # REPO-FORBIDDEN (ZIRV_CTX_PACE_POLL): active API-poll fallback when the collector is stale. Default: true.
# poll_min_interval_secs = 60        # REPO-FORBIDDEN (ZIRV_CTX_PACE_POLL_MIN_INTERVAL_SECS): floor between poll attempts. Default: 60.

# [pace.use_credits]                 # REPO-FORBIDDEN (ZIRV_CTX_PACE_USE_CREDITS_CLAUDE / _CODEX): skip pace gating for a harness whose vendor plan covers overage.
# claude = false                     # Default: false.
# codex = false                      # Default: false.

# [optimize]
# enabled = true                     # whether the Stop hook may queue an "optimize recommended" entry
# sessions_sampled = 10              # sessions sampled per optimize run
# max_surface_bytes = 200_000        # cap on the total analysed surface
# model = ""                         # REPO-FORBIDDEN (ZIRV_CTX_OPTIMIZE_MODEL): distiller model for optimize. Default: "" (reuses handoff.model's own resolution).
# recommend_tool_failure_rate = 0.25 # tool-failure rate that triggers a recommendation
# recommend_corrections = 3          # correction count that triggers a recommendation
# recommend_cooldown_secs = 86_400   # minimum time between optimize recommendations

# [prompt]                           # every key below is REPO-FORBIDDEN
# enabled = true                     # REPO-FORBIDDEN (ZIRV_CTX_PROMPT): whether the composed system prompt is injected at all. Default: true.
# repo_layer = true                  # REPO-FORBIDDEN (ZIRV_CTX_PROMPT_REPO): whether <repo>/.zirv/system-prompt.md is read. Default: true.
# max_repo_bytes = 4096              # REPO-FORBIDDEN (ZIRV_CTX_PROMPT_MAX_REPO_BYTES): cap on the untrusted repo layer. Default: 4096.
# harnesses = true                   # REPO-FORBIDDEN (ZIRV_CTX_PROMPT_HARNESSES): whether the derived harness roster is injected. Default: true.

# [mail]
# enabled = true                     # REPO-FORBIDDEN (ZIRV_CTX_MAIL): whether the mailbox is on at all. Default: true.
# max_message_bytes = 4096           # cap on a single stored message body
# max_delivered_bytes = 4096         # REPO-FORBIDDEN (ZIRV_CTX_MAIL_MAX_DELIVERED_BYTES): cap on mail surfaced to a session at once. Default: 4096.
# keep = 50                          # unread messages kept before the oldest are pruned

# [memory]                           # every key below is REPO-FORBIDDEN
# enabled = true                     # REPO-FORBIDDEN (ZIRV_CTX_MEMORY): MASTER switch -- false disables both the private and shared bank, regardless of shared_enabled. Default: true.
# harvest = false                    # REPO-FORBIDDEN (ZIRV_CTX_MEMORY_HARVEST): whether facts are auto-harvested from distilled handoffs. Default: false.
# max_entries = 50                   # REPO-FORBIDDEN (ZIRV_CTX_MEMORY_MAX_ENTRIES): entries kept before the oldest (by Written) are pruned. Default: 50.
# max_entry_bytes = 512              # REPO-FORBIDDEN (ZIRV_CTX_MEMORY_MAX_ENTRY_BYTES): cap on a single entry's body. Default: 512.
# max_injected_bytes = 2048          # REPO-FORBIDDEN (ZIRV_CTX_MEMORY_MAX_INJECTED_BYTES): superseded by core_max_bytes; kept only so an old config does not hard-error. Default: 2048.
# shared_enabled = true              # REPO-FORBIDDEN (ZIRV_CTX_MEMORY_SHARED): whether the repo-owned shared bank (<repo>/.zirv/memory/) is read at all, underneath the enabled master switch above. Default: true.
# core_max_bytes = 2048              # REPO-FORBIDDEN (ZIRV_CTX_MEMORY_CORE_MAX_BYTES): cap on the merged private+shared core layer surfaced to every session. Default: 2048.
# retrieval_max_bytes = 2048         # REPO-FORBIDDEN (ZIRV_CTX_MEMORY_RETRIEVAL_MAX_BYTES): cap on context-ranked retrieved entries, on top of core. Default: 2048.
# retrieval_max_entries = 6          # REPO-FORBIDDEN (ZIRV_CTX_MEMORY_RETRIEVAL_MAX_ENTRIES): max number of retrieved entries, independent of bytes. Default: 6.

# [chrome]
# banner = true                      # the launch banner naming the resolved harness, the rule that chose it, and the session id
# bar = true                         # the reserved bottom status bar
# events = true                      # REPO-FORBIDDEN (ZIRV_CTX_QUIET, inverted): the `zirv \u{25b8}` announcement channel on stderr. Default: true.

# [dash]                             # every key below is REPO-FORBIDDEN except idle_quiet_ms
# enabled = true                     # REPO-FORBIDDEN (ZIRV_CTX_DASH): whether `zirv chat` opens the dashboard multiplexer. Default: true.
# sidebar_cols = 24                  # REPO-FORBIDDEN (ZIRV_CTX_DASH_SIDEBAR_COLS): width, in columns, of the persistent session sidebar. Default: 24.
# roster_max_age_secs = 604_800      # REPO-FORBIDDEN (ZIRV_CTX_DASH_ROSTER_MAX_AGE_SECS): how long a quit-time roster stays offered for restore. Default: 604800 (7 days).
# max_panes = 9                      # REPO-FORBIDDEN (ZIRV_CTX_DASH_MAX_PANES): most panes one dashboard may hold at once, counting the orchestrator. Default: 9.
# mouse = true                       # REPO-FORBIDDEN (ZIRV_CTX_DASH_MOUSE): whether the dashboard captures the mouse for wheel-scroll. Default: true.
# idle_quiet_ms = 10000              # not REPO-FORBIDDEN (a tuning knob, like pace.soft_percent): how long a signal-less pane's pty output must be quiet before it counts as Idle. Default: 10000 (10s).

# [workflow]                         # every key below is REPO-FORBIDDEN: they decide whether repository-authored content runs or is injected at all.
# repo_checks_enabled = true         # REPO-FORBIDDEN (ZIRV_CTX_WORKFLOW_REPO_CHECKS): whether the commands in .zirv/verify.toml and the npm scripts in package.json may actually execute. Off = listed in the report with a skip line, never run, and never passing evidence. Default: true.
# repo_skills_enabled = true         # REPO-FORBIDDEN (ZIRV_CTX_WORKFLOW_REPO_SKILLS): whether .zirv/skills/ manifests are loaded at all. A repo manifest may only ever ADD an id regardless. Default: true.
# telemetry_enabled = true           # REPO-FORBIDDEN (ZIRV_CTX_WORKFLOW_TELEMETRY): local workflow telemetry (`zirv workflow stats`). Default: true.
# telemetry_max_events = 1000        # REPO-FORBIDDEN (ZIRV_CTX_WORKFLOW_TELEMETRY_MAX_EVENTS): how many events one repository keeps before the oldest are pruned. Default: 1000.
# telemetry_retention_days = 30      # REPO-FORBIDDEN (ZIRV_CTX_WORKFLOW_TELEMETRY_RETENTION_DAYS): how long an event is kept. Default: 30.

# [policy]                           # zirv's own canonical permissions policy (src/commands/ctx/policy.rs).
# Not REPO-FORBIDDEN, and the ONE table here that does NOT deep-merge:
# `[policy]` is lifted out of every layer and folded by `policy::resolve` as
# `env(cap)` if set, else `max(home(cap), repo(cap))`, over the ordered stance
# `allow < ask < deny`. So a repo checkout may only ever ratchet a stance
# STRICTER, never looser -- which is why forbidding these keys outright would
# also forbid the narrowing they exist for. `ZIRV_CTX_POLICY_<CAPABILITY>`
# sits above the fold and wins in both directions (the operator's escape
# hatch, mirroring ZIRV_AGENT_<NAME>_ENABLED). Every stance defaults to
# "allow", meaning "zirv declares no restriction of its own"; what each
# harness can actually enforce for a stricter one is reported per adapter,
# honestly, rather than assumed -- see AgentAdapter::policy_support.
# repo_fs_write = "allow"            # writes inside this checkout. Default: "allow".
# outside_repo_fs_write = "allow"    # writes anywhere else on the machine. Default: "allow".
# shell_exec = "allow"               # running shell commands at all. Default: "allow".
# network = "allow"                  # outbound network access from the session. Default: "allow".
# approval = "allow"                 # "allow" = approvals may be bypassed, "ask" = must be requested, "deny" = attempt nothing needing approval (a read-only session). Default: "allow".
# git_push_destructive = "allow"     # `git push`, and history-rewriting/destructive git. Default: "allow".
# tool_access = "allow"              # which of the harness's own tools (including MCP servers) may run. Default: "allow".
