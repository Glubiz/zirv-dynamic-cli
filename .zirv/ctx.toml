# Repo-layer zirv configuration (untrusted layer: operator config and env win).
#
# This file is an exhaustive reference of every configurable key of
# `CtxConfig` (see src/commands/ctx/config.rs), each shown COMMENTED OUT at
# its built-in default -- sample-config style. Uncomment a key to override it
# for this repo.
#
# A commented key sets nothing, so an operator's own ~/.zirv/ctx.toml
# customization of that same key keeps working. This matters because the
# repo layer merges ON TOP of the operator's global config (see
# `CtxConfig::load`): an ACTIVE default-valued key here would silently
# clobber any global override of the same key for anyone who checks out this
# repo. Only uncomment a key you actually mean to pin for this repo.
#
# Keys marked REPO-FORBIDDEN may not be set from a repo checkout at all (see
# REPO_FORBIDDEN in config.rs) -- uncommenting one has no effect here; set it
# in ~/.zirv/ctx.toml, via ZIRV_CTX_* env vars, or flags instead. The value
# shown is still the real default, for reference.

# agent = "claude"             # REPO-FORBIDDEN (ZIRV_CTX_AGENT): which adapter zirv drives. Default: unset (auto-detect).
# agent_bin = "/path/to/bin"   # REPO-FORBIDDEN (ZIRV_CTX_AGENT_BIN): explicit path to the agent binary. Default: unset.

[chat]
# Model for the interactive orchestrator session (displayed in the banner/header).
# User decision 2026-08-13: the orchestrator runs Fable (claude-fable-5).
# Not REPO-FORBIDDEN: this only shapes a session the operator deliberately
# launched, and the choice is disclosed on the `zirv \u{25b8}` announcement
# channel rather than spent silently in the background (see ChatConfig's doc
# comment in config.rs). Commenting this out reverts to the built-in default
# (unset: leaves the agent's own default model in place). This is the ONLY
# active key in this file -- every other key below is commented out.
model = "fable"

# [review]                          # every key below is REPO-FORBIDDEN (ZIRV_CTX_REVIEW_MODEL_CLAUDE / ZIRV_CTX_REVIEW_MODEL_CODEX)
# claude = "opus"                   # code-review model for a claude harness. Default: unset (one tier below the orchestrator seat's model on claude's ladder -- see AgentAdapter::review_model_below).
# codex = "gpt-5.6-terra"           # code-review model for a codex harness. Default: unset (one tier below the seat on codex's own ladder).

# [worker]                          # claude/codex/default_depth/default_read_only below are REPO-FORBIDDEN; max_depth/deny_network may only be NARROWED by a repo layer (issue #262)
# claude = "opus"                   # model for a delegated headless claude worker (`zirv ctx agent`, and the dashboard's own spawn-request pane). Default: unset (claude's own hard default "sonnet" -- see AgentAdapter::default_worker_model).
# codex = "gpt-5.6-terra"           # model for a delegated headless codex worker. Default: unset (codex has no adapter-owned default, so its own CLI/config default applies).
# default_depth = 1                 # REPO-FORBIDDEN (ZIRV_CTX_WORKER_DEFAULT_DEPTH): hops of further `zirv agent` delegation a ROOT session's envelope starts with. Default: 1.
# default_read_only = false         # REPO-FORBIDDEN (ZIRV_CTX_WORKER_DEFAULT_READ_ONLY): whether a ROOT session's envelope starts read-only when `--mode` is unstated. Default: false.
# max_depth = 255                   # narrow-only (a repo layer may only LOWER this): operator ceiling on any envelope's delegation_depth. Default: 255 (no extra cap beyond default_depth).
# deny_network = false              # narrow-only (a repo layer may only turn this ON): denies network tools for every envelope computed in this repo. Default: false.

# [handover.claude]                 # every key below is REPO-FORBIDDEN (ZIRV_CTX_HANDOVER_CLAUDE_CHEAP / _STANDARD / _DEEP) -- model-id override for `zirv ctx handover`'s generic tiers on a claude target.
# cheap = "haiku"                   # Default: unset (built-in ladder default "haiku").
# standard = "sonnet"               # Default: unset (built-in ladder default "sonnet").
# deep = "opus"                     # Default: unset (built-in ladder default "opus").

# [handover.codex]                  # every key below is REPO-FORBIDDEN (ZIRV_CTX_HANDOVER_CODEX_CHEAP / _STANDARD / _DEEP) -- same, for a codex target.
# cheap = "gpt-5.4-mini"            # Default: unset (built-in ladder default "gpt-5.4-mini").
# standard = "gpt-5.6-terra"        # Default: unset (built-in ladder default "gpt-5.6-terra").
# deep = "gpt-5.6-sol"              # Default: unset (built-in ladder default "gpt-5.6-sol").

# [score]
# window = 10                        # trailing turns the rolling rot score looks over
# min_turns = 10                     # turns required before the score is trusted at all
# token_floor = 100_000              # REPO-FORBIDDEN (ZIRV_CTX_TOKEN_FLOOR): explicit absolute floor override, wins over token_floor_ratio below. Default: unset.
# token_ceiling = 160_000            # REPO-FORBIDDEN (ZIRV_CTX_TOKEN_CEILING): explicit absolute ceiling override, wins over token_ceiling_ratio below. Default: unset.
# token_floor_ratio = 0.5            # REPO-FORBIDDEN (ZIRV_CTX_SCORE_TOKEN_FLOOR_RATIO): fraction of the resolved context-window capacity below which token pressure contributes nothing (issue #155).
# token_ceiling_ratio = 0.8          # REPO-FORBIDDEN (ZIRV_CTX_SCORE_TOKEN_CEILING_RATIO): fraction of the resolved context-window capacity at which token pressure is maxed out.
# model_context_tokens = 200_000     # REPO-FORBIDDEN (ZIRV_CTX_SCORE_MODEL_CONTEXT_TOKENS): operator-pinned capacity, overriding the adapter's own reported context window. Default: unset (adapter-reported; falls back to the 100_000/160_000 absolutes above when no capacity is known at all).
# weight_tool_failure = 40.0         # score weight for repeated tool failures (weights sum to 100)
# weight_repetition = 30.0           # score weight for repeated actions
# weight_marker = 30.0               # score weight for the rot marker appearing in output
# same_error_weight = 0.0            # score weight for a stuck same-error loop (longest run of identical normalized tool-error text). Default 0: inert until an operator opts in.
# repetition_threshold = 3           # repeat count before the repetition signal trips
# same_error_threshold = 3           # repeat count of the SAME normalized error before the same-error signal trips
# advise_at = 40                     # score at which zirv advises the operator
# compact_at = 60                    # score at which zirv recommends a compact/handoff
# restart_at = 80                    # score at which zirv recommends a restart
# marker = "[zirv]"                  # literal string the rot engine treats as an explicit marker signal

# [wrap]
# debounce_ms = 3000                 # quiet time after output before wrap considers a turn settled
# inject_timeout_ms = 20_000         # how long wrap waits for an injected prompt to land

# [supervise]
# max_restarts = 2                   # restarts a supervised run allows before giving up
# poll_ms = 2000                     # polling interval for supervised process state
# interval_secs = 900                # interval between supervised health checks
# max_cycle_secs = 3600              # max wall time for one supervised cycle
# max_failures = 5                   # consecutive failures before supervise gives up entirely
# backoff_base_secs = 60             # base backoff between restart attempts
# on_failure = "notify-send done"    # REPO-FORBIDDEN (ZIRV_CTX_ON_FAILURE): shell command run on failure. Default: unset.
# max_nudges = 3                     # consecutive nudge-driven restarts tolerated before nudges are ignored
# max_heavy_operations = 1           # REPO-FORBIDDEN (ZIRV_CTX_SUPERVISE_MAX_HEAVY_OPERATIONS): machine-wide cap on concurrent heavy commands (issue #155, replacing #133's max_heavy_workers)
# max_heavy_workers = 1              # DEPRECATED alias for max_heavy_operations. REPO-FORBIDDEN (ZIRV_CTX_SUPERVISE_MAX_HEAVY_WORKERS)
# max_writers = 1                    # REPO-FORBIDDEN (ZIRV_CTX_SUPERVISE_MAX_WRITERS): machine-wide cap on concurrent writing-mode delegated workers, one per checkout (issue #267)
# idle_no_tool_secs = 450            # REPO-FORBIDDEN (ZIRV_CTX_SUPERVISE_IDLE_NO_TOOL_SECS): no PTY output/transcript growth/mail activity for this long while idle latches `stalled` (issue #310)
# in_tool_secs = 1200                # REPO-FORBIDDEN (ZIRV_CTX_SUPERVISE_IN_TOOL_SECS): same progress clock, applied while inside a tool call (issue #310)
# stall_grace_secs = 120             # REPO-FORBIDDEN (ZIRV_CTX_SUPERVISE_STALL_GRACE_SECS): time a steering nudge gets before a stalled session is terminated (issue #310)
# chain_max_restarts = 3             # REPO-FORBIDDEN (ZIRV_CTX_SUPERVISE_CHAIN_MAX_RESTARTS): unplanned same-class respawns across process boundaries before the restart-chain breaker trips (issue #310)
# chain_max_gap_secs = 300           # REPO-FORBIDDEN (ZIRV_CTX_SUPERVISE_CHAIN_MAX_GAP_SECS): max gap between chained respawns still counted toward the breaker (issue #310)

