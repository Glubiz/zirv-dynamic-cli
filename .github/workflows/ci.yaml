name: CI Pipeline

# CI is a merge gate only: it runs on PRs targeting main (and on demand).
# It deliberately does NOT run on pushes to main — a commit can only reach
# main through a PR that already passed these exact checks, and the CD
# pipeline triggers directly on the merge push instead of chaining off a
# post-merge CI run.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test, Lint, and Format Check
    runs-on: ubuntu-latest
    # A wedged apt mirror or a hung test must fail the run, not hold it for
    # the 6-hour default.
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 (full history, not the default shallow depth-1 clone):
      # ZCHK-VERSION-BUMP's `git merge-base HEAD origin/main` needs a common
      # ancestor with main actually present in history, which a depth-1
      # checkout of just the PR ref would not have.
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set Up Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo Registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # cargo test alone never builds target/debug/zirv; some ctx tests spawn it as a subprocess.
      - name: Build Binary
        run: cargo build

      # Issue #276: the built-in self-check registry (proves/fix/origin-
      # labeled invariants like version-bump and argv shape) runs from the
      # branch binary, not just as unit tests -- a regression that only
      # shows up when the checks run for real (a source file the check
      # itself expects to exist, say) fails the PR gate here.
      - name: Run built-in self-checks (zirv verify --builtin)
        run: ./target/debug/zirv verify --builtin --json

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143

      # nextest runs each test in its own process, so the process-wide
      # `env::set_var` races that used to require `--test-threads=1` cannot
      # happen -- see .config/nextest.toml. `--no-fail-fast` matches serial
      # `cargo test`'s behavior of running every test and reporting a
      # complete `failures:`-equivalent list, which the sorted failure-NAME
      # baseline methodology (CLAUDE.md) depends on -- nextest's own default
      # is fail-fast, which would otherwise stop at the first failure.
      - name: Run Tests
        run: cargo nextest run --no-fail-fast

      - name: Check Code Formatting
        run: cargo fmt -- --check

      - name: Run Clippy Lint
        run: cargo clippy --all-targets -- -D warnings

      # CD releases a Windows binary, so the unix-only modules and their
      # windows counterparts have to keep compiling cleanly, tests included.
      - name: Add Windows Target
        run: rustup target add x86_64-pc-windows-gnu

      # `ureq` -> `rustls` -> `ring` compiles C sources through its build
      # script, so the cross-target clippy pass needs a Windows-targeting C
      # compiler on the Linux runner.
      # The runner's azure apt mirror wedges regularly (every index fetch
      # stalling or Ign'd), so this swaps sources to the canonical archive
      # up front, forces IPv4, and bounds every fetch; the step timeout is
      # the backstop that turns any remaining stall into a fast, retryable
      # failure instead of a six-hour hang.
      - name: Install mingw-w64 (ring's build script needs a cross C compiler)
        timeout-minutes: 8
        run: |
          if command -v x86_64-w64-mingw32-gcc >/dev/null; then exit 0; fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Run Clippy Lint (Windows target)
        run: cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings

  # nextest (above) runs each test in its own process, so it cannot catch the
  # process-wide `env::set_var` races that serial `cargo test` was written to
  # guard against -- CLAUDE.md keeps the serial run as a compatibility
  # fallback and requires both to pass, so this job enforces that in CI. It
  # runs in parallel with the `test` job (not as an extra step in it) so it
  # doesn't lengthen that job's critical path.
  serial-test:
    name: Serial Test Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Rust Toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Cache Cargo Registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # cargo test alone never builds target/debug/zirv; some ctx tests spawn it as a subprocess.
      - name: Build Binary
        run: cargo build

      - name: Run Tests (serial)
        run: cargo test --verbose -- --test-threads=1

  # Every merge to main triggers CD, which re-publishes whatever version main
  # carries and fails on a duplicate — so every PR must raise Cargo.toml's
  # version above its base branch before it can merge.
  version-bump:
    name: Version Bump Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Require a version above the base branch
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          extract() { grep '^version' "$1" | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/'; }
          git show "origin/${{ github.base_ref }}:Cargo.toml" > /tmp/base-Cargo.toml
          BASE=$(extract /tmp/base-Cargo.toml)
          HEAD=$(extract Cargo.toml)
          echo "base branch version: $BASE — PR version: $HEAD"
          if [ "$BASE" = "$HEAD" ]; then
            echo "::error file=Cargo.toml::Version ($HEAD) is unchanged from ${{ github.base_ref }}. Bump it — every merge to main publishes a release."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$BASE" "$HEAD" | sort -V | tail -1)" != "$HEAD" ]; then
            echo "::error file=Cargo.toml::Version ($HEAD) is lower than ${{ github.base_ref }}'s ($BASE)."
            exit 1
          fi
